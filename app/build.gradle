plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.groovebox'
    compileSdk 35
    buildToolsVersion "35.0.0"
    ndkVersion "27.2.12479018"

    defaultConfig {
        def versionPropsFile = file('../version.properties')
        def versionProps = new Properties()
        versionProps.load(new FileInputStream(versionPropsFile))

        applicationId "com.groovebox.cafa.v4"
        minSdk 26
        targetSdk 35
        versionCode versionProps['VERSION_CODE'].toInteger()
        versionName versionProps['VERSION_NAME'] + '-cafa.4'

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        vectorDrawables {
            useSupportLibrary true
        }
        
        externalNativeBuild {
            cmake {
                cppFlags "-std=c++17 -O3 -ffast-math -flto"
                arguments "-DANDROID_STL=c++_shared"
                abiFilters 'armeabi-v7a', 'arm64-v8a', 'x86', 'x86_64'
            }
        }

        ndk {
            abiFilters 'armeabi-v7a', 'arm64-v8a', 'x86', 'x86_64'
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }
    buildFeatures {
        compose true
        prefab true
    }
    composeOptions {
        kotlinCompilerExtensionVersion '1.5.1'
    }
    packagingOptions {
        jniLibs {
            useLegacyPackaging = true
        }
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
    }
    externalNativeBuild {
        cmake {
            path file('../composeApp/native/CMakeLists.txt')
            version '3.22.1'
        }
    }
}
dependencies {
    implementation project(':composeApp')
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.6.2'
    implementation 'androidx.activity:activity-compose:1.8.1'
    implementation platform('androidx.compose:compose-bom:2023.08.00')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-extended'
    
    implementation 'com.google.oboe:oboe:1.9.0'
    
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
    androidTestImplementation platform('androidx.compose:compose-bom:2023.08.00')
    androidTestImplementation 'androidx.compose.ui:ui-test-junit4'
    debugImplementation 'androidx.compose.ui:ui-tooling'
    debugImplementation 'androidx.compose.ui:ui-test-manifest'
}

// Validate the tracked version without changing source files during a build.
// Bump version.properties explicitly when preparing a release.
tasks.register('checkVersion') {
    def propsFile = rootProject.file('version.properties')
    inputs.file(propsFile)
    doLast {
        def props = new Properties()
        propsFile.withInputStream { props.load(it) }
        if (!(props['VERSION_CODE'] ==~ /[1-9][0-9]*/) ||
                !(props['VERSION_NAME'] ==~ /[0-9]+\.[0-9]+\.[0-9]+(?:[-+][A-Za-z0-9.-]+)?/)) {
            throw new GradleException('version.properties requires a positive VERSION_CODE and semantic VERSION_NAME')
        }
    }
}
preBuild.dependsOn tasks.named('checkVersion')
