plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

// prepare-skiff.sh exports the unmodified release and its factory sample tables.
def stockDir = rootProject.file('../.cache/skiff-2.5.1/source')
def runtimeDir = rootProject.file('../.cache/skiff-2.5.1/expanded')
def protocolDir = rootProject.file('../skiff/firmware/src')
def stockNotices = tasks.register('stockNotices', Sync) {
    from(stockDir) {
        include 'LICENSE', 'LICENSING.md', 'LICENSES/**', 'web/FUKIAI-LICENSE.txt',
                'assets/breaks/ATTRIBUTION.txt', 'assets/samples-cc0/*.txt', 'assets/fonts/OFL.txt'
        into 'skiff'
    }
    from('src/main/cpp/engines') {
        include '**/LICENSE*', '**/NOTICE*', '**/README.md'
        into 'skiff/engines'
    }
    into layout.buildDirectory.dir('generated/stockNotices')
}

android {
    namespace 'org.fm1.companion.demo'
    compileSdk 35
    buildToolsVersion '35.0.0'

    ndkVersion '27.2.12479018'
    externalNativeBuild {
        cmake {
            path file('src/main/cpp/CMakeLists.txt')
            version '3.22.1'
        }
    }
    sourceSets.main.assets.srcDir(layout.buildDirectory.dir('generated/stockNotices'))
    defaultConfig {
        applicationId 'org.fm1.companion.demo'
        minSdk 26
        targetSdk 35
        versionCode 15
        versionName '0.7.0'
        ndk { abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86_64', 'x86' }
        externalNativeBuild {
            cmake {
                arguments "-DSKIFF_SOURCE_DIR=${runtimeDir.canonicalPath}",
                        "-DSKIFF_GENERATED_DIR=${new File(runtimeDir, 'build/gen').canonicalPath}",
                        "-DSKIFF_PROTOCOL_DIR=${protocolDir.canonicalPath}",
                        '-DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON'
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions { jvmTarget = '1.8' }
}

tasks.named('preBuild').configure { dependsOn stockNotices }

dependencies {
    implementation project(':companion')
    testImplementation 'junit:junit:4.13.2'
}
